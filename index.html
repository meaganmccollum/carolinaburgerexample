<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carolina Stack Site Screener</title>
  <style>
    :root { --purple:#522D80; --orange:#F56600; --ink:#1f2937; --muted:#6b7280; --card:#f5f3fa; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,sans-serif; color:var(--ink); background:#fff; }
    main { max-width:1000px; margin:0 auto; padding:32px 20px 48px; }
    h1 { color:var(--purple); margin-bottom:6px; }
    .sub { color:var(--muted); margin-top:0; }
    .controls { display:flex; gap:12px; align-items:end; flex-wrap:wrap; background:var(--card); padding:16px; border-radius:12px; }
    label { display:flex; flex-direction:column; gap:6px; font-weight:700; }
    select { padding:9px; border:1px solid #c7c3d6; border-radius:7px; min-width:220px; }
    .winner { margin:20px 0; padding:18px; border-left:6px solid var(--orange); background:#fff7f0; border-radius:8px; }
    table { width:100%; border-collapse:collapse; margin-top:16px; }
    th,td { padding:10px 8px; border-bottom:1px solid #e5e7eb; text-align:left; }
    th { background:var(--purple); color:#fff; }
    .score { font-weight:700; color:var(--purple); }
    .note { margin-top:20px; color:var(--muted); font-size:.92rem; }
  </style>
</head>
<body>
  <main>
    <h1>Carolina Stack Burger Co. — Site Screener</h1>
    <p class="sub">A small classroom prototype using five fictional Greenville-area candidate zones.</p>

    <section class="controls">
      <label>Decision scenario
        <select id="scenario">
          <option value="sales">Maximize sales potential</option>
          <option value="risk">Reduce development risk</option>
          <option value="community">Prioritize community access</option>
        </select>
      </label>
    </section>

    <section class="winner" id="winner"></section>

    <table>
      <thead><tr><th>Candidate zone</th><th>Demand</th><th>Access</th><th>Competition gap</th><th>Feasibility</th><th>Overall score</th></tr></thead>
      <tbody id="results"></tbody>
    </table>

    <p class="note">All data are fictional. This is a screening prototype, not a site recommendation or market study.</p>
  </main>

  <script>
    const sites = [
      { name:'Woodruff Road / Roper Mountain Road', demand:90, access:88, gap:40, feasibility:65 },
      { name:'Augusta Road / Mauldin Road', demand:72, access:78, gap:70, feasibility:82 },
      { name:'White Horse Road / State Park Road', demand:60, access:65, gap:88, feasibility:76 },
      { name:'Pleasantburg Drive / Cherrydale Drive', demand:76, access:72, gap:60, feasibility:68 },
      { name:'Wade Hampton Boulevard / Taylors Road', demand:84, access:81, gap:48, feasibility:74 }
    ];

    const weights = {
      sales: { demand:.40, access:.30, gap:.20, feasibility:.10, label:'sales potential' },
      risk: { demand:.20, access:.20, gap:.20, feasibility:.40, label:'risk reduction' },
      community: { demand:.25, access:.30, gap:.30, feasibility:.15, label:'community access' }
    };

    function render() {
      const scenario = document.querySelector('#scenario').value;
      const w = weights[scenario];
      const ranked = sites.map(s => ({...s, score: s.demand*w.demand + s.access*w.access + s.gap*w.gap + s.feasibility*w.feasibility}))
        .sort((a,b) => b.score-a.score);
      document.querySelector('#winner').innerHTML = `<strong>Top-ranked zone:</strong> ${ranked[0].name}<br>It scores ${ranked[0].score.toFixed(1)} under the <strong>${w.label}</strong> scenario.`;
      document.querySelector('#results').innerHTML = ranked.map(s => `<tr><td>${s.name}</td><td>${s.demand}</td><td>${s.access}</td><td>${s.gap}</td><td>${s.feasibility}</td><td class="score">${s.score.toFixed(1)}</td></tr>`).join('');
    }
    document.querySelector('#scenario').addEventListener('change', render);
    render();
  </script>
</body>
</html>
